  <script>
(function(){
  const out=document.getElementById('out'), actions=document.getElementById('actions');
  
  window.append=function(s,cls){
    const line=document.createElement('div');
    line.textContent='['+new Date().toLocaleTimeString()+'] '+s;
    if(cls)line.className=cls;
    out.appendChild(line);
    out.scrollTop=out.scrollHeight;
  };

  window.reportExploitProgress=function(stage,name,percent,detail){
    if(detail) window.append('[PROGRESS] '+detail,'');
  };

  window.onZoofComplete=function(status){
    if(status && status.success){
      window.append('SUCCESS: kernel patch and payload completed.','ok');
    } else { 
      actions.style.display='flex'; 
      window.append('FAIL: completed='+!!(status&&status.completed)+' kpatched='+!!(status&&status.kpatched)+' payloadRunning='+!!(status&&status.payloadRunning),'bad'); 
    }
  };

  window.showExploitError=function(msg){ 
    actions.style.display='flex'; 
    window.append('ERROR: '+(msg||'unknown'),'bad'); 
  };
  
  window.addEventListener('error',function(e){window.append('JS ERROR: '+(e.message||e.error||'unknown'),'bad');});
  
  window.append('RUN launcher loaded. Target locked to PS4 13.52.','ok');
  window.append('Loading remote engine…');
})();
</script>
  <script type="module">
(async function () {
  try {
    if (typeof window.append === "function")
      window.append("Loading remote engine from Pastefy...", "ok");

  } catch (e) {
    if (typeof window.showExploitError === "function")
